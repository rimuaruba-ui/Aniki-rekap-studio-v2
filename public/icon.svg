<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="glow-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="112" fill="url(#bg-grad)" />

  <!-- Outer Neon Border Ring -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="url(#accent-grad)" stroke-width="6" stroke-opacity="0.6" />

  <!-- Comic Panel 1 -->
  <rect x="96" y="100" width="140" height="140" rx="24" fill="#1e293b" stroke="url(#accent-grad)" stroke-width="4" filter="url(#shadow)"/>
  <!-- Comic Panel 2 -->
  <rect x="260" y="100" width="156" height="140" rx="24" fill="#1e293b" stroke="#3b82f6" stroke-width="4" filter="url(#shadow)"/>
  <!-- Comic Panel 3 (Wide) -->
  <rect x="96" y="264" width="320" height="148" rx="24" fill="#1e293b" stroke="url(#glow-grad)" stroke-width="4" filter="url(#shadow)"/>

  <!-- Panel Internal Art - Mountain / Sun Graphic in Panel 1 -->
  <circle cx="166" cy="155" r="22" fill="#fbbf24" opacity="0.9" />
  <path d="M 112 216 L 150 170 L 180 200 L 210 160 L 224 216 Z" fill="#3b82f6" opacity="0.8" />

  <!-- Manga Speedlines in Panel 2 -->
  <line x1="276" y1="120" x2="390" y2="120" stroke="#ec4899" stroke-width="4" stroke-linecap="round" opacity="0.7"/>
  <line x1="286" y1="145" x2="400" y2="145" stroke="#ec4899" stroke-width="3" stroke-linecap="round" opacity="0.5"/>
  <line x1="276" y1="170" x2="390" y2="170" stroke="#ec4899" stroke-width="4" stroke-linecap="round" opacity="0.8"/>
  <line x1="296" y1="195" x2="380" y2="195" stroke="#ec4899" stroke-width="3" stroke-linecap="round" opacity="0.6"/>

  <!-- Soundwaves / AI Sparkle in Panel 3 -->
  <!-- Wave bars -->
  <rect x="136" y="324" width="10" height="28" rx="5" fill="#f59e0b" />
  <rect x="156" y="306" width="10" height="64" rx="5" fill="#f59e0b" />
  <rect x="176" y="290" width="10" height="96" rx="5" fill="#f59e0b" />
  <rect x="196" y="312" width="10" height="52" rx="5" fill="#f59e0b" />
  <rect x="216" y="328" width="10" height="20" rx="5" fill="#f59e0b" />

  <!-- Center AI Sparkle Star -->
  <g transform="translate(320, 338)">
    <path d="M 0 -45 Q 0 0 45 0 Q 0 0 0 45 Q 0 0 -45 0 Q 0 0 0 -45 Z" fill="url(#glow-grad)" filter="url(#shadow)"/>
    <circle cx="0" cy="0" r="10" fill="#ffffff" />
  </g>
</svg>
